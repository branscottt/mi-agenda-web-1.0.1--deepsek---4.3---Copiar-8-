<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://dfcfimipkfhitlsyixqu.supabase.co" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Ventas Live - Organify</title>
    <link rel="stylesheet" href="style.css?v=68">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* ===== VENTAS LIVE: espacio de trabajo ===== */
        .ventas-live-screen {
            min-height: 100vh;
            background: radial-gradient(ellipse at top, rgba(157, 78, 221, 0.16), transparent 55%), var(--bg, #0a0a0f);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 48px;
        }
        .vl-topbar {
            width: 100%;
            max-width: 1060px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 22px;
        }
        .vl-brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.2rem; color: #f8f9fa; }
        .vl-brand .vl-logo {
            width: 42px; height: 42px; border-radius: 12px;
            display: grid; place-items: center;
            background: linear-gradient(135deg, #9d4edd, #7b2cbf);
            color: #fff; font-size: 1.15rem;
            box-shadow: 0 4px 18px rgba(157, 78, 221, 0.45);
        }
        .vl-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
        .vl-actions .btn-top {
            padding: 9px 16px; border-radius: 10px; border: none;
            font-size: 0.85rem; font-weight: 600; cursor: pointer; color: #fff;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: background .15s ease;
        }
        .vl-actions .btn-top:hover { background: rgba(255, 255, 255, 0.13); }
        .vl-actions .btn-top.primary { background: linear-gradient(135deg, #9d4edd, #7b2cbf); border: none; box-shadow: 0 4px 14px rgba(157, 78, 221, 0.35); }
        .vl-main { width: 100%; max-width: 1060px; }
        .vl-workspace-head {
            background: var(--glass, rgba(20, 20, 30, 0.7));
            border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.1));
            border-radius: 20px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            flex-wrap: wrap;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-bottom: 14px;
        }
        .vl-workspace-head h1 { margin: 0; font-size: 1.25rem; color: #f8f9fa; display: flex; align-items: center; gap: 10px; }
        .vl-ws-titulo { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
        .vl-ws-sub { display: flex; align-items: center; gap: 7px; color: var(--muted, #adb5bd); font-size: 0.85rem; font-weight: 600; }
        .vl-ws-sub i { color: #25d366; width: 14px; }
        .vl-ws-sub.sin-numero i { color: #adb5bd; }
        .vl-ws-acciones { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .vl-config-btn {
            width: 38px; height: 38px; border-radius: 11px; border: 1px solid rgba(255,255,255,0.16);
            background: rgba(255,255,255,0.06); color: #ced4da; cursor: pointer; font-size: 1rem;
            display: grid; place-items: center; transition: all .15s ease;
        }
        .vl-config-btn:hover { background: rgba(255,255,255,0.14); color: #fff; transform: rotate(25deg); }
        .vl-pill {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(0, 184, 148, 0.14);
            border: 1px solid rgba(0, 184, 148, 0.45);
            color: #7ff5d8;
            border-radius: 999px; padding: 5px 16px;
            font-size: 0.82rem; font-weight: 700;
        }
        .vl-loading { color: var(--muted, #adb5bd); padding: 60px 0; text-align: center; }

        /* ===== Navegación por secciones ===== */
        .vl-nav {
            display: flex; gap: 8px; flex-wrap: wrap;
            background: var(--glass, rgba(20, 20, 30, 0.55));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px; padding: 8px;
            margin-bottom: 18px;
            backdrop-filter: blur(8px);
        }
        .vl-tab {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 18px; border-radius: 11px; border: none; cursor: pointer;
            background: transparent; color: #adb5bd;
            font-size: 0.9rem; font-weight: 700; font-family: inherit;
            transition: all .15s ease; flex: 1 1 auto; justify-content: center;
        }
        .vl-tab:hover { background: rgba(255, 255, 255, 0.06); color: #f8f9fa; }
        .vl-tab.active {
            background: linear-gradient(135deg, #9d4edd, #7b2cbf);
            color: #fff; box-shadow: 0 4px 14px rgba(157, 78, 221, 0.35);
        }
        .vl-view { display: none; }
        .vl-view.active { display: block; animation: vlFade .18s ease; }
        @keyframes vlFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

        /* ===== MODO LIVE ===== */
        .vl-live-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 16px; align-items: start; }
        .vl-card {
            background: var(--glass, rgba(20, 20, 30, 0.7));
            border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.1));
            border-radius: 20px; padding: 22px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .vl-card h2 { margin: 0 0 4px; font-size: 1rem; color: #f8f9fa; display: flex; align-items: center; gap: 8px; }
        .vl-card .sub { color: var(--muted, #adb5bd); font-size: 0.82rem; margin-bottom: 16px; }
        .vl-field { margin-bottom: 14px; }
        .vl-field label { display: block; font-size: 0.8rem; font-weight: 700; color: #ced4da; margin-bottom: 6px; }
        .vl-input-wrap { display: flex; align-items: center; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14); border-radius: 14px; overflow: hidden; transition: border .15s; }
        .vl-input-wrap:focus-within { border-color: #9d4edd; }
        .vl-input-prefix { padding: 0 6px 0 16px; font-weight: 700; color: #c77dff; font-size: 1.1rem; }
        .vl-input {
            width: 100%; background: transparent; border: none; outline: none;
            color: #f8f9fa; font-size: 1.25rem; font-weight: 600; font-family: inherit;
            padding: 16px 16px 16px 4px;
        }
        .vl-input::placeholder { color: #6c757d; font-weight: 500; }
        /* Sugerencias de usuario: al escribir las primeras letras de un cliente
           que ya existe aparece la lista (clic o flechas + Enter). El contenedor
           del campo lleva .vl-field-rel porque .vl-input-wrap recorta (overflow). */
        .vl-field-rel { position: relative; }
        .vl-sugerencias {
            position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 40;
            background: #211a33; border: 1px solid rgba(255,255,255,0.16); border-radius: 14px;
            box-shadow: 0 14px 34px rgba(0,0,0,0.45);
            max-height: 264px; overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        .vl-sugerencia {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            width: 100%; background: transparent; border: none; font-family: inherit;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            color: #f8f9fa; font-size: 0.95rem; text-align: left;
            padding: 11px 14px; cursor: pointer;
        }
        .vl-sugerencia:last-child { border-bottom: none; }
        .vl-sugerencia .nick { font-weight: 700; }
        .vl-sugerencia .meta { color: #adb5bd; font-size: 0.78rem; white-space: nowrap; }
        .vl-sugerencia.activa, .vl-sugerencia:hover { background: rgba(157, 78, 221, 0.22); }
        .vl-submit {
            width: 100%; border: none; cursor: pointer;
            background: linear-gradient(135deg, #9d4edd, #7b2cbf);
            color: #fff; font-size: 1.15rem; font-weight: 800; font-family: inherit;
            padding: 18px; border-radius: 14px; margin-top: 6px;
            box-shadow: 0 8px 24px rgba(157, 78, 221, 0.42);
            transition: transform .1s ease, box-shadow .15s ease;
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
        }
        .vl-submit:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(157, 78, 221, 0.55); }
        .vl-submit:active { transform: translateY(0); }
        .vl-submit:disabled { opacity: .55; cursor: wait; transform: none; }

        .vl-session {
            display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
            background: rgba(157, 78, 221, 0.10);
            border: 1px solid rgba(157, 78, 221, 0.35);
            border-radius: 14px; padding: 12px 16px; margin-top: 16px;
        }
        .vl-session .live-tag { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; color: #c77dff; font-size: 0.9rem; }
        .vl-session .live-tag .dot { width: 9px; height: 9px; border-radius: 50%; background: #9d4edd; box-shadow: 0 0 10px #9d4edd; animation: vlPulse 1.4s infinite; }
        @keyframes vlPulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
        .vl-session .live-meta { color: #ced4da; font-size: 0.85rem; font-weight: 600; }
        .vl-btn-ghost {
            background: rgba(255, 255, 255, 0.07); color: #ced4da; border: 1px solid rgba(255,255,255,0.15);
            padding: 7px 14px; border-radius: 9px; font-size: 0.78rem; font-weight: 700; cursor: pointer; font-family: inherit;
        }
        .vl-btn-ghost:hover { background: rgba(255, 255, 255, 0.13); color: #fff; }

        .vl-client-mini { display: none; margin-top: 14px; }
        .vl-client-mini.visible { display: block; }
        .vl-client-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        .vl-client-head .nick { font-size: 1.15rem; font-weight: 800; color: #f8f9fa; }
        .vl-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 0.72rem; font-weight: 800; padding: 3px 10px; border-radius: 999px; }
        .vl-badge.nuevo { background: rgba(120, 180, 255, 0.14); color: #a5d8ff; border: 1px solid rgba(120,180,255,.4); }
        .vl-badge.confiable { background: rgba(0, 184, 148, 0.14); color: #7ff5d8; border: 1px solid rgba(0,184,148,.4); }
        .vl-badge.problematico { background: rgba(255, 193, 7, 0.14); color: #ffe066; border: 1px solid rgba(255,193,7,.45); }
        .vl-badge.bloqueado { background: rgba(230, 60, 60, 0.16); color: #ff9f9f; border: 1px solid rgba(230,60,60,.5); }
        .vl-client-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
        .vl-cstat { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 10px 12px; }
        .vl-cstat .k { font-size: 0.7rem; color: var(--muted, #adb5bd); font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
        .vl-cstat .v { font-size: 1.05rem; font-weight: 800; color: #f8f9fa; margin-top: 2px; }
        .vl-alert {
            display: none; margin-top: 12px; padding: 12px 14px; border-radius: 12px;
            font-size: 0.85rem; font-weight: 600; line-height: 1.5;
        }
        .vl-alert.visible { display: block; }
        .vl-alert.danger { background: rgba(230, 60, 60, 0.14); border: 1px solid rgba(230, 60, 60, 0.45); color: #ffb3b3; }
        .vl-alert.warning { background: rgba(255, 193, 7, 0.12); border: 1px solid rgba(255, 193, 7, 0.4); color: #ffe066; }
        .vl-ultima { margin-top: 12px; font-size: 0.85rem; color: #ced4da; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

        .vl-stat-big { text-align: center; }
        .vl-stat-big .v { font-size: 1.7rem; font-weight: 800; color: #f8f9fa; line-height: 1.1; }
        .vl-stat-big .k { font-size: 0.75rem; color: var(--muted, #adb5bd); font-weight: 700; }

        .vl-empty { text-align: center; color: var(--muted, #adb5bd); padding: 40px 10px; font-size: 0.9rem; }

        @media (max-width: 860px) {
            .vl-live-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 720px) {
            .vl-workspace-head { padding: 16px 18px; }
            .vl-workspace-head h1 { font-size: 1.05rem; }
            .vl-tab { padding: 11px 10px; font-size: 0.8rem; }
            .vl-card { padding: 18px; }
            .vl-input { font-size: 1.1rem; }
        }

        /* ===== Chips de grupos (Procesos) ===== */
        .vl-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
        .vl-chip {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 8px 14px; border-radius: 999px; cursor: pointer;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
            color: #adb5bd; font-size: 0.82rem; font-weight: 700; font-family: inherit;
            transition: all .15s ease;
        }
        .vl-chip .n { background: rgba(255,255,255,0.12); border-radius: 999px; padding: 1px 8px; font-size: 0.75rem; }
        .vl-chip:hover { background: rgba(255,255,255,0.1); color: #f8f9fa; }
        .vl-chip.active { background: linear-gradient(135deg, #9d4edd, #7b2cbf); border-color: transparent; color: #fff; box-shadow: 0 4px 12px rgba(157,78,221,.32); }
        .vl-chip.active .n { background: rgba(255,255,255,0.22); }

        /* ===== Filas de proceso / cliente ===== */
        .vl-fila {
            display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 14px 16px; margin-bottom: 10px;
            transition: border .15s ease;
        }
        .vl-fila:hover { border-color: rgba(255,255,255,0.2); }
        .vl-fila.clickeable { cursor: pointer; }
        .vl-fila .f-nick { font-weight: 800; color: #f8f9fa; font-size: 1rem; }
        .vl-fila .f-sub { color: var(--muted, #adb5bd); font-size: 0.8rem; margin-top: 2px; }
        .vl-fila .f-monto { font-size: 1.05rem; font-weight: 800; color: #f8f9fa; }
        .vl-fila .f-der { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .vl-fila .f-datos { display: flex; gap: 14px; align-items: center; color: #ced4da; font-size: 0.85rem; font-weight: 600; }
        .vl-fila .f-datos b { color: #f8f9fa; }
        .vl-acciones { display: flex; gap: 8px; flex-wrap: wrap; }
        .vl-edad-warn { color: #ffe066; font-weight: 700; }

        /* ===== Botones ===== */
        .vl-btn {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 9px 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.16);
            background: rgba(255,255,255,0.06); color: #e9ecef;
            font-size: 0.82rem; font-weight: 700; cursor: pointer; font-family: inherit;
            transition: all .15s ease;
        }
        .vl-btn:hover { background: rgba(255,255,255,0.13); }
        .vl-btn.primary { background: linear-gradient(135deg, #9d4edd, #7b2cbf); border-color: transparent; color: #fff; box-shadow: 0 4px 14px rgba(157,78,221,.32); }
        .vl-btn.primary:hover { box-shadow: 0 6px 18px rgba(157,78,221,.48); }
        .vl-btn.success { background: rgba(0,184,148,0.16); border-color: rgba(0,184,148,0.5); color: #7ff5d8; }
        .vl-btn.success:hover { background: rgba(0,184,148,0.26); }
        .vl-btn.danger { background: rgba(230,60,60,0.14); border-color: rgba(230,60,60,0.5); color: #ff9f9f; }
        .vl-btn.danger:hover { background: rgba(230,60,60,0.26); }
        .vl-btn.warn { background: rgba(255,193,7,0.12); border-color: rgba(255,193,7,0.45); color: #ffe066; }
        .vl-btn:disabled { opacity: .55; cursor: wait; }

        /* ===== Modales ===== */
        .vl-modal-overlay {
            position: fixed; inset: 0; z-index: 9000;
            background: rgba(5,5,10,0.7); backdrop-filter: blur(3px);
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .vl-modal {
            background: #16141f; border: 1px solid rgba(255,255,255,0.14);
            border-radius: 20px; padding: 22px; width: 100%; max-width: 480px;
            max-height: 86vh; overflow-y: auto;
            box-shadow: 0 24px 70px rgba(0,0,0,0.55);
            animation: vlFade .16s ease;
        }
        .vl-modal h3 { margin: 0 0 4px; color: #f8f9fa; font-size: 1.1rem; display: flex; align-items: center; gap: 9px; }
        .vl-modal .m-sub { color: var(--muted, #adb5bd); font-size: 0.84rem; margin-bottom: 16px; }
        .vl-modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
        .vl-control {
            width: 100%; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.14); border-radius: 10px;
            color: #f8f9fa; font-size: 0.95rem; font-family: inherit;
            padding: 10px 12px; outline: none;
        }
        .vl-control:focus { border-color: #9d4edd; }
        .vl-control option { background: #1c1630; color: #f8f9fa; }
        .vl-form-row { margin-bottom: 12px; }
        .vl-form-row label { display: block; font-size: 0.78rem; font-weight: 700; color: #ced4da; margin-bottom: 5px; }
        .vl-monto-grande { font-size: 1.5rem !important; font-weight: 800; }
        .vl-opciones { display: grid; gap: 8px; }
        .vl-opcion {
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 12px 14px; font-size: 0.9rem; color: #e9ecef;
            transition: all .15s ease; font-weight: 600;
        }
        .vl-opcion:hover { background: rgba(255,255,255,0.08); }
        .vl-opcion.sel { border-color: #9d4edd; background: rgba(157,78,221,0.14); color: #fff; }
        .vl-check-item { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px dashed rgba(255,255,255,0.08); font-size: 0.9rem; color: #e9ecef; }
        .vl-check-item:last-child { border-bottom: none; }
        .vl-check-item input { width: 18px; height: 18px; accent-color: #9d4edd; }

        /* ===== Tabla ficha cliente ===== */
        .vl-tabla { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .vl-tabla th { text-align: left; color: var(--muted, #adb5bd); font-size: 0.72rem; text-transform: uppercase; letter-spacing: .4px; padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .vl-tabla td { padding: 8px; color: #e9ecef; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: top; }
        .vl-ficha-sec { margin-top: 14px; }
        .vl-ficha-sec h4 { margin: 0 0 8px; color: #f8f9fa; font-size: 0.85rem; text-transform: uppercase; letter-spacing: .5px; opacity: .8; }
        .vl-grid-contadores { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 12px 0; }
        .vl-cstat2 { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 10px 12px; }
        .vl-cstat2 .k { font-size: 0.68rem; color: var(--muted, #adb5bd); font-weight: 700; text-transform: uppercase; }
        .vl-cstat2 .v { font-size: 1rem; font-weight: 800; color: #f8f9fa; margin-top: 2px; }
        .vl-buscar { display: flex; gap: 10px; margin-bottom: 16px; }
        .vl-buscar .vl-control { flex: 1; font-size: 1.05rem; padding: 13px 16px; }
        .vl-hist-item { border-left: 3px solid rgba(255,255,255,0.15); padding: 6px 12px; margin: 6px 0; background: rgba(255,255,255,0.02); border-radius: 0 10px 10px 0; }

        /* ===== Envíos / Finanzas ===== */
        .vl-grupo-titulo {
            display: flex; align-items: center; gap: 10px;
            font-size: 0.95rem; font-weight: 800; color: #f8f9fa; margin: 18px 0 10px;
        }
        .vl-grupo-titulo .cnt { background: rgba(255,255,255,0.1); border-radius: 999px; padding: 1px 10px; font-size: 0.8rem; }
        .vl-datos-copy { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .vl-grid-fin { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-bottom: 16px; }
        .vl-monto.pos { color: #7ff5d8; }
        .vl-monto.neg { color: #ff9f9f; }
        .vl-fin-k { font-size: 0.7rem; color: var(--muted, #adb5bd); font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
        .vl-fin-v { font-size: 1.35rem; font-weight: 800; color: #f8f9fa; margin-top: 3px; }
        .vl-nota { font-size: 0.78rem; color: var(--muted, #adb5bd); line-height: 1.5; margin-top: 6px; }
        .vl-fila-accion { display: flex; align-items: center; gap: 6px; }
        .vf-form-grid { grid-template-columns: 150px 1fr 170px 160px auto !important; }
        @media (max-width: 860px) {
            .vf-form-grid { grid-template-columns: 1fr 1fr !important; }
        }

        /* ===== Burbujas de conversación (las usa el chat del LIVE) ===== */
        .vl-fila-msg { display: flex; flex-direction: column; max-width: 80%; }
        .vl-fila-msg.in { align-self: flex-start; align-items: flex-start; }
        .vl-fila-msg.out { align-self: flex-end; align-items: flex-end; }
        .vl-msg-autor { font-size: 0.64rem; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
        .vl-fila-msg.in .vl-msg-autor { color: #c77dff; }
        .vl-fila-msg.out .vl-msg-autor { color: #a89bb8; }

        .vl-burbuja { border-radius: 12px; padding: 9px 13px 7px; max-width: 100%; box-shadow: 0 1px 2px rgba(0,0,0,0.35); }
        .vl-burbuja .vl-burbuja-txt { font-size: 0.92rem; line-height: 1.5; word-wrap: break-word; overflow-wrap: anywhere; white-space: normal; }
        .vl-burbuja .vl-burbuja-hora { font-size: 0.66rem; margin-top: 4px; text-align: right; }
        .vl-burbuja.in { background: #241d38; color: #e9edef; border-top-left-radius: 3px; }
        .vl-burbuja.in .vl-burbuja-txt { color: #e9edef; }
        .vl-burbuja.in .vl-burbuja-hora { color: #a89bb8; }
        .vl-burbuja.out { background: linear-gradient(135deg, #9d4edd, #7b2cbf); border-top-right-radius: 3px; }
        .vl-burbuja.out .vl-burbuja-txt { color: #ffffff; }
        .vl-burbuja.out .vl-burbuja-hora { color: rgba(255,255,255,0.78); }

        @media (max-width: 860px) {
            .vl-fila-msg { max-width: 90%; }
        }

        /* ===== Chat del cliente dentro de MODO LIVE =====
           Con aire adentro (padding) y alto cómodo para leer el hilo
           mientras se carga el pedido. */
        .vl-chat-mini-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .vl-chat-mini-scroll {
            margin-top: 12px; padding: 14px; border-radius: 14px;
            background-color: #0b0912;
            background-image: repeating-linear-gradient(45deg, rgba(157,78,221,0.05) 0 2px, transparent 2px 10px);
            border: 1px solid rgba(157, 78, 221, 0.18);
            display: flex; flex-direction: column; gap: 10px;
            min-height: 140px; max-height: min(48vh, 440px); overflow-y: auto;
        }
        .vl-chat-mini-scroll:empty { display: none; }
        .vl-chat-mini-scroll .vl-burbuja .vl-burbuja-txt { font-size: 0.88rem; }
        .vl-chat-mini-scroll .vl-burbuja { padding: 8px 11px 6px; }
        .vl-chat-mini-scroll .vl-msg-autor { font-size: 0.6rem; margin-bottom: 3px; }
        .vl-chat-mini-vacio { color: #a89bb8; font-size: 0.85rem; text-align: center; padding: 24px 12px; line-height: 1.6; }
        .vl-chat-mini-composer { display: flex; gap: 8px; margin-top: 12px; }
        .vl-chat-mini-composer .vl-control { flex: 1; background: #241b38; border-color: transparent; color: #e9edef; min-height: 44px; }
        .vl-chat-mini-composer .vl-control::placeholder { color: #a89bb8; }
        .vl-chat-mini-composer .vl-control:focus { border-color: #9d4edd; }
        .vl-chat-mini-composer .vl-btn { flex-shrink: 0; padding: 10px 14px; min-height: 44px; }
        .vl-chat-mini-acciones { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        /* Resalta la tarjeta cuando hay una conversación abierta */
        #lv-chat-card.con-chat { border-color: rgba(157, 78, 221, 0.45); }

        /* ===== Cajón lateral de conversaciones (sobrepuesto al LIVE) =====
           Panel FLOTANTE: se separa de los bordes (margen 14px), con
           esquinas redondeadas y ancho cómodo de lectura, así el chat no
           queda pegado al canto de la pantalla y se ve completo en web,
           tablet y móvil. Sigue sin fondo opaco: lo de atrás no se bloquea. */
        .vl-drawer {
            position: fixed; top: 14px; right: 14px; height: calc(100vh - 28px);
            width: min(520px, calc(100vw - 28px));
            background: #12101c;
            border: 1px solid rgba(157, 78, 221, 0.30);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(0,0,0,0.55);
            display: flex; flex-direction: column; z-index: 8600;
            transform: translateX(calc(100% + 24px)); visibility: hidden;
            transition: transform .22s ease, visibility .22s;
        }
        .vl-drawer.abierto { transform: translateX(0); visibility: visible; }

        .vl-drawer-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: #1c1530; flex-shrink: 0; }
        .vld-titulo { flex: 1; min-width: 0; font-weight: 800; color: #e9edef; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .vld-icon {
            background: transparent; border: none; color: #adb5bd; cursor: pointer; font-family: inherit;
            font-size: 1rem; padding: 6px 9px; border-radius: 8px; line-height: 1;
        }
        .vld-icon:hover { background: rgba(255,255,255,0.08); color: #f8f9fa; }
        .vld-sub { padding: 9px 16px; color: #a89bb8; font-size: 0.78rem; border-bottom: 1px solid rgba(255,255,255,0.07); flex-shrink: 0; }
        .vld-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 14px 18px; }
        .vld-hilo { display: flex; flex-direction: column; gap: 10px; }
        .vld-foot { display: flex; gap: 8px; padding: 11px 14px; background: #1c1530; border-top: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; }
        .vld-foot .vl-control { flex: 1; background: #241b38; border-color: transparent; color: #e9edef; min-height: 44px; }
        .vld-foot .vl-control::placeholder { color: #a89bb8; }
        .vld-foot .vl-control:focus { border-color: #9d4edd; }
        .vld-foot .vl-btn { flex-shrink: 0; padding: 10px 14px; min-height: 44px; }

        .vl-conv-item {
            display: block; width: 100%; text-align: left; font-family: inherit; cursor: pointer;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; padding: 11px 12px; margin-bottom: 8px;
            transition: background .15s ease, border .15s ease;
        }
        .vl-conv-item:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.2); }
        .vl-conv-item.activo { border-color: #9d4edd; background: rgba(157,78,221,0.12); }
        .vl-conv-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
        .vl-conv-nombre { font-weight: 800; color: #f8f9fa; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .vl-conv-hora { color: #adb5bd; font-size: 0.7rem; flex-shrink: 0; }
        .vl-conv-num { color: #c77dff; font-size: 0.74rem; font-weight: 700; margin-top: 1px; }
        .vl-conv-msg {
            color: #ced4da; font-size: 0.81rem; margin-top: 4px; line-height: 1.4;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .vl-conv-foot { display: flex; align-items: center; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
        .vl-conv-chip { font-size: 0.66rem; font-weight: 700; color: #adb5bd; background: rgba(255,255,255,0.07); border-radius: 999px; padding: 2px 8px; }
        .vl-conv-chip.humano { background: rgba(0,184,148,0.16); border: 1px solid rgba(0,184,148,0.45); color: #7ff5d8; }
        .vl-conv-chip.bot { background: rgba(157,78,221,0.16); border: 1px solid rgba(157,78,221,0.45); color: #c77dff; }
        .vl-conv-noleido { margin-left: auto; background: #9d4edd; color: #fff; font-size: 0.68rem; font-weight: 800; border-radius: 999px; padding: 2px 8px; }
        .vl-conv-badge { background: #9d4edd; color: #fff; font-size: 0.64rem; font-weight: 800; border-radius: 999px; padding: 1px 6px; margin-left: 4px; }
        /* Aviso del bot: informativo, no destructivo (ámbar suave, sin parpadeo) */
        .vl-conv-chip.aviso {
            background: rgba(255,193,7,0.14); border: 1px solid rgba(255,193,7,0.4);
            color: #ffe066; cursor: help;
        }
        .vl-conv-item.con-aviso { border-left: 3px solid rgba(255,193,7,0.55); }
        /* Badge "algo por revisar": ámbar con brillo suave (nunca rojo ni parpadeo) */
        .vl-conv-badge.aviso {
            background: #ffc107; color: #10171f;
            animation: vlBrilloSuave 2.6s ease-in-out infinite;
        }
        @keyframes vlBrilloSuave {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,193,7,0.30); }
            50%      { box-shadow: 0 0 9px 3px rgba(255,193,7,0.45); }
        }
        @media (prefers-reduced-motion: reduce) { .vl-conv-badge.aviso { animation: none; } }
        /* Banner del aviso dentro del chat: qué pasó + qué hacer */
        .vl-aviso-banner {
            background: rgba(255,193,7,0.10); border: 1px solid rgba(255,193,7,0.38);
            border-radius: 10px; padding: 10px 12px; margin: 0 0 12px;
        }
        .vl-aviso-titulo { color: #ffe066; font-weight: 700; font-size: 0.86rem; line-height: 1.35; }
        .vl-aviso-accion { color: #ced4da; font-size: 0.81rem; margin-top: 4px; line-height: 1.4; }
        .vl-aviso-accion b { color: #ffe066; }
        /* Botón "Avisos" encendido */
        .vl-btn.activo { border-color: rgba(255,193,7,0.6); color: #ffe066; }

        /* ===== Ajustes para tablet y móvil =====
           El cajón ya no queda pegado al borde (su ancho sale de
           min(520px, 100vw - 28px)); en pantallas chicas la navegación se
           desliza en UNA fila en vez de apretarse en dos líneas, los
           botones ganan altura táctil y el chat mantiene alto cómodo. */
        @media (max-width: 860px) {
            .vl-drawer { top: 10px; right: 10px; height: calc(100vh - 20px); width: calc(100vw - 20px); border-radius: 16px; }
            .vl-live-grid { gap: 14px; }
        }
        @media (max-width: 720px) {
            .vl-nav { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
            .vl-nav::-webkit-scrollbar { display: none; }
            .vl-tab { flex: 0 0 auto; padding: 10px 15px; font-size: 0.86rem; }
            .vl-btn, .vl-btn-ghost, .vld-icon { min-height: 40px; }
            .vl-control { font-size: 16px; }      /* sin zoom automático en iOS */
            .vl-topbar { gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
            .vl-actions { width: 100%; justify-content: flex-start; }
            .vl-actions .btn-top { padding: 9px 13px; font-size: 0.8rem; }
            .vl-chat-mini-scroll { max-height: 52vh; }
            .vl-workspace-head { padding: 16px; }
            .vld-body { padding: 12px 12px 16px; }
            .vl-modal { padding: 18px; }
        }
        @media (max-width: 430px) {
            .vl-brand { font-size: 1.05rem; }
            .vl-actions .btn-top { padding: 8px 11px; font-size: 0.76rem; }
            .vl-chat-mini-acciones { width: 100%; }
            .vl-chat-mini-acciones .vl-btn { flex: 1 1 auto; justify-content: center; }
        }
    </style>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="ventas-live-screen">
        <div class="vl-topbar">
            <div class="vl-brand">
                <div class="vl-logo"><i class="fas fa-bolt"></i></div>
                <span>Ventas Live</span>
            </div>
            <div class="vl-actions">
                <button class="btn-top" id="vl-back-hub" type="button"><i class="fas fa-th-large"></i> Mis proyectos</button>
                <button class="btn-top" id="vl-go-reservas" type="button" style="display:none;"><i class="fas fa-calendar-check"></i> Reservas de Pymes</button>
                <button class="btn-top" id="vl-logout" type="button"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
            </div>
        </div>

        <div class="vl-main">
            <div class="vl-loading" id="vl-loading"><i class="fas fa-spinner fa-spin"></i> Cargando tu espacio...</div>

            <div id="vl-content" style="display:none;">
                <div class="vl-workspace-head">
                    <div class="vl-ws-titulo">
                        <h1><i class="fas fa-store"></i> <span id="vl-nombre">—</span></h1>
                        <div class="vl-ws-sub sin-numero" id="vl-ws-sub">
                            <i class="fab fa-whatsapp"></i> <span id="vl-whatsapp">Cargando…</span>
                        </div>
                    </div>
                    <div class="vl-ws-acciones">
                        <span class="vl-pill" id="vl-plan"><i class="fas fa-circle-notch fa-spin"></i></span>
                        <button class="vl-config-btn" id="vl-wa-btn" type="button" title="Conectar WhatsApp (bot automático)"><i class="fab fa-whatsapp"></i></button>
                        <button class="vl-config-btn" id="vl-config-btn" type="button" title="Configurar nombre y WhatsApp del espacio"><i class="fas fa-gear"></i></button>
                    </div>
                </div>

                <nav class="vl-nav" id="vl-nav" aria-label="Secciones">
                    <button class="vl-tab active" data-view="live" type="button"><i class="fas fa-bolt"></i> LIVE</button>
                    <button class="vl-tab" data-view="procesos" type="button"><i class="fas fa-list-check"></i> Procesos</button>
                    <button class="vl-tab" data-view="clientes" type="button"><i class="fas fa-users"></i> Clientes</button>
                    <button class="vl-tab" data-view="envios" type="button"><i class="fas fa-truck-fast"></i> Envíos</button>
                    <button class="vl-tab" data-view="finanzas" type="button"><i class="fas fa-chart-line"></i> Finanzas</button>
                </nav>

                <section class="vl-view active" id="vl-view-live"></section>
                <section class="vl-view" id="vl-view-procesos"></section>
                <section class="vl-view" id="vl-view-clientes"></section>
                <section class="vl-view" id="vl-view-envios"></section>
                <section class="vl-view" id="vl-view-finanzas"></section>
            </div>
        </div>
    </div>

    <script type="module" src="dist/app.js?v=92"></script>
    <script defer src="dist/legacy.js?v=71"></script>
</body>
</html>
