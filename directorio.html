<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://dfcfimipkfhitlsyixqu.supabase.co" crossorigin>
    <title>Directorio de PYMEs - Organify | Agenda online para negocios locales</title>
    <meta name="description" content="Directorio público de pymes y profesionales en Organify: estética, salud, deporte, servicios profesionales y técnicos. Mira reseñas y agenda tu hora con un clic.">
    <link rel="canonical" href="https://agenda-pro-red.vercel.app/directorio.html">
    <meta property="og:title" content="Directorio de PYMEs - Organify">
    <meta property="og:description" content="Descubre negocios locales, mira sus reseñas y agenda tu hora con un clic.">
    <meta property="og:type" content="website">
    <style>
        /* ===== TOKENS REALES DE LA WEB (style.css :root) ===== */
        :root {
            --primary: #9d4edd;
            --primary-dark: #7b2cbf;
            --primary-light: #c77dff;
            --primary-glow: rgba(157, 78, 221, 0.4);
            --bg: #0a0a0f;
            --glass: rgba(20, 20, 30, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --text: #f8f9fa;
            --muted: #adb5bd;
            --success: #00b894;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            background-image:
                radial-gradient(circle at 15% 10%, rgba(157, 78, 221, 0.13) 0%, transparent 22%),
                radial-gradient(circle at 90% 15%, rgba(199, 125, 255, 0.09) 0%, transparent 20%),
                radial-gradient(circle at 80% 90%, rgba(255, 109, 0, 0.05) 0%, transparent 22%);
            background-attachment: fixed;
        }
        a { text-decoration: none; color: inherit; }

        .nav {
            position: sticky; top: 0; z-index: 50;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            background: rgba(10, 10, 15, 0.75);
            border-bottom: 1px solid var(--glass-border);
        }
        .nav-inner { max-width: 1120px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.5px; }
        .logo span {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .btn {
            display: inline-block; padding: 9px 20px; border-radius: 999px;
            font-weight: 700; font-size: 0.9rem; cursor: pointer;
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff; box-shadow: 0 6px 20px var(--primary-glow);
        }
        .btn-primary:hover { transform: translateY(-2px); }

        .hero { text-align: center; padding: 56px 24px 40px; }
        .hero h1 { font-size: clamp(1.7rem, 3.4vw, 2.4rem); letter-spacing: -0.8px; font-weight: 800; }
        .hero h1 em {
            font-style: normal;
            background: linear-gradient(120deg, var(--primary-light), var(--primary));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .hero p { margin-top: 12px; color: var(--muted); max-width: 560px; margin-left: auto; margin-right: auto; }

        .controls { max-width: 980px; margin: 0 auto; padding: 0 24px 20px; }
        .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 18px; }
        .chip {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 999px; padding: 8px 16px;
            font-size: 0.85rem; font-weight: 600; color: var(--muted); cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all .15s ease;
        }
        .chip.active, .chip:hover { border-color: var(--primary-light); color: var(--primary-light); }
        .search input {
            width: 100%; padding: 13px 18px; border-radius: 12px;
            border: 1px solid var(--glass-border);
            font-size: 0.95rem; background: var(--glass); color: var(--text);
            outline: none; backdrop-filter: blur(8px);
        }
        .search input::placeholder { color: #8b8fa3; }
        .search input:focus { border-color: var(--primary-light); }

        .grid {
            max-width: 1100px; margin: 0 auto; padding: 10px 24px 60px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
        }
        .card {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 16px; overflow: hidden;
            backdrop-filter: blur(10px);
            display: flex; flex-direction: column;
            transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
        }
        .card:hover { transform: translateY(-4px); border-color: rgba(199, 125, 255, 0.4); box-shadow: 0 14px 34px rgba(0, 0, 0, 0.4); }
        .card-cover {
            height: 130px;
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.25), rgba(199, 125, 255, 0.12));
            display: flex; align-items: center; justify-content: center; font-size: 2.4rem;
        }
        .card-cover img { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 18px; display: flex; flex-direction: column; flex: 1; }
        .card-body h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
        .cat { font-size: 0.82rem; color: var(--primary-light); font-weight: 600; margin-bottom: 6px; }
        .dir { font-size: 0.82rem; color: #8b8fa3; margin-bottom: 10px; }
        .stars { font-size: 0.9rem; color: #f5b301; letter-spacing: 2px; margin-bottom: 14px; }
        .stars .count { color: #8b8fa3; font-size: 0.8rem; letter-spacing: 0; margin-left: 6px; }
        .card .btn-reservar {
            margin-top: auto; text-align: center; padding: 11px; border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #fff;
            font-weight: 700; font-size: 0.92rem;
            box-shadow: 0 6px 18px var(--primary-glow);
            transition: transform .15s ease;
        }
        .card .btn-reservar:hover { transform: translateY(-2px); }
        .empty { text-align: center; color: var(--muted); padding: 40px; grid-column: 1 / -1; }

        footer {
            padding: 30px 24px; text-align: center; color: #8b8fa3; font-size: 0.85rem;
            border-top: 1px solid var(--glass-border);
        }
        footer a { color: var(--primary-light); font-weight: 600; }
    </style>
</head>
<body>

    <nav class="nav">
        <div class="nav-inner">
            <div class="logo">Organi<span>fy</span></div>
            <a class="btn btn-primary" href="login.html">Iniciar sesión</a>
        </div>
    </nav>

    <header class="hero">
        <h1>Directorio de PYMEs <em>que usan Organify</em></h1>
        <p>Descubre negocios locales, mira sus reseñas y agenda tu hora con un clic.</p>
    </header>

    <div class="controls">
        <div class="chips" id="directorio-chips"></div>
        <div class="search">
            <input type="text" id="directorio-buscar" placeholder="Buscar pyme o tipo de servicio..." autocomplete="off">
        </div>
    </div>

    <main class="grid" id="directorio-grid">
        <p class="empty">Cargando directorio...</p>
    </main>

    <footer>
        <p>© 2026 Organify · <a href="index.html">Inicio</a> · <a href="login.html">Crear tu negocio gratis</a></p>
    </footer>

    <script src="directorio.js?v=43" defer></script>
</body>
</html>
