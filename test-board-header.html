<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harness — Header board Información (nombre largo)</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style> html,body{margin:0;background:#0f0f14;} </style>
</head>
<body>
<!-- Réplica del header de ClientBoard.js (#kanban-modal) con nombre LARGO -->
<div id="kanban-modal" class="kanban-modal-overlay" style="position:relative;">
  <div class="kanban-modal">
    <header class="kanban-modal-header">
      <div class="kanban-cliente-avatar"><i class="fas fa-user"></i></div>
      <div class="kanban-cliente-info">
        <h3><i class="fas fa-id-card"></i> Información de Administrador General de la Cuenta Demo</h3>
        <span class="kanban-cliente-meta">
          administradorgeneraldelacuenta@demo.com · <i class="fas fa-phone"></i> +56 9 8765 4321
        </span>
        <div style="margin-top:4px;"><span class="chip-etiqueta" style="display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:0.7rem;background:rgba(46,230,168,0.12);color:#2ee6a8;border:1px solid rgba(46,230,168,0.25);"><i class="fas fa-tag"></i> Pagado</span></div>
      </div>
      <div class="kanban-estilos-actions">
        <button class="kanban-estilos-btn" title="Guardar estas listas como estilo reutilizable en otros clientes"><i class="fas fa-save"></i><span class="kanban-estilos-txt"> Guardar estilo</span></button>
        <button class="kanban-estilos-btn" title="Aplicar un estilo de listas guardado"><i class="fas fa-layer-group"></i><span class="kanban-estilos-txt"> Usar estilo</span></button>
        <button class="kanban-estilos-btn" title="Elegí qué listas ve el cliente"><i class="fas fa-eye"></i><span class="kanban-estilos-txt"> Lo que ve el cliente</span></button>
        <button class="kanban-estilos-btn" style="color:#ff6b6b;" title="Eliminar este cliente"><i class="fas fa-trash"></i><span class="kanban-estilos-txt"> Eliminar cliente</span></button>
      </div>
      <button class="kanban-btn-close" title="Cerrar"><i class="fas fa-times"></i></button>
    </header>
    <div class="kanban-board" style="flex:1;min-height:300px;padding:18px;">
      <div class="kanban-list" style="width:260px;min-width:260px;">
        <header class="kanban-list-header"><span class="kanban-list-titulo">Historia</span><span class="kanban-list-count">2</span></header>
        <div class="kanban-list-cards"><div class="kanban-card">card</div><div class="kanban-card">card 2</div></div>
        <div class="kanban-add-card">+ Añadir tarjeta</div>
      </div>
      <div class="kanban-add-list"><i class="fas fa-plus"></i> Añadir lista</div>
    </div>
  </div>
</div>
<pre id="results" style="white-space:pre-wrap;font-family:monospace;font-size:12px;color:#9ae6b4;padding:10px;"></pre>
</body>
</html>
