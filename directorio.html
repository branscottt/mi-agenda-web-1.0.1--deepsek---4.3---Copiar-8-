<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio de PYMEs - Organify | Agenda online para negocios locales</title>
    <meta name="description" content="Directorio público de pymes y profesionales en Organify: estética, salud, deporte, servicios profesionales y técnicos. Mira reseñas y agenda tu hora con un clic.">
    <link rel="canonical" href="https://agenda-pro-red.vercel.app/directorio.html">
    <meta property="og:title" content="Directorio de PYMEs - Organify">
    <meta property="og:description" content="Descubre negocios locales, mira sus reseñas y agenda tu hora con un clic.">
    <meta property="og:type" content="website">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #1e1b2e; background: #faf9ff; line-height: 1.6;
        }
        a { text-decoration: none; color: inherit; }

        .nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 5%; background: #fff; border-bottom: 1px solid #ece9f7;
        }
        .nav-logo { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; }
        .nav-logo span { color: #7c3aed; }
        .nav a.btn {
            background: linear-gradient(135deg, #7c3aed, #a855f7); color: #fff;
            font-weight: 600; font-size: 0.9rem; padding: 9px 20px; border-radius: 999px;
        }

        .hero {
            text-align: center; padding: 56px 5% 40px;
            background: radial-gradient(800px 360px at 50% -20%, rgba(168,85,247,0.14), transparent 60%), #faf9ff;
        }
        .hero h1 { font-size: clamp(1.7rem, 3.4vw, 2.4rem); letter-spacing: -0.8px; font-weight: 800; }
        .hero p { margin-top: 12px; color: #5c5674; max-width: 560px; margin-left: auto; margin-right: auto; }

        .controls { max-width: 980px; margin: 0 auto; padding: 0 5% 20px; }
        .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 18px; }
        .chip {
            background: #fff; border: 1.5px solid #e6e0f7; border-radius: 999px;
            padding: 8px 16px; font-size: 0.85rem; font-weight: 600; color: #4b4563; cursor: pointer;
            transition: all .15s ease;
        }
        .chip.active, .chip:hover { border-color: #7c3aed; color: #7c3aed; }
        .search input {
            width: 100%; padding: 13px 18px; border-radius: 12px; border: 1.5px solid #e6e0f7;
            font-size: 0.95rem; background: #fff; outline: none;
        }
        .search input:focus { border-color: #7c3aed; }

        .grid {
            max-width: 1100px; margin: 0 auto; padding: 10px 5% 60px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
        }
        .card {
            background: #fff; border: 1px solid #eee9fb; border-radius: 16px; overflow: hidden;
            display: flex; flex-direction: column; transition: transform .15s ease, box-shadow .15s ease;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 14px 34px rgba(60,30,110,0.10); }
        .card-cover {
            height: 130px; background: linear-gradient(135deg, #f3ebff, #e9ddfd);
            display: flex; align-items: center; justify-content: center; font-size: 2.4rem;
        }
        .card-cover img { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 18px; display: flex; flex-direction: column; flex: 1; }
        .card-body h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
        .cat { font-size: 0.82rem; color: #7c3aed; font-weight: 600; margin-bottom: 6px; }
        .dir { font-size: 0.82rem; color: #8a84a3; margin-bottom: 10px; }
        .stars { font-size: 0.9rem; color: #f5b301; letter-spacing: 2px; margin-bottom: 14px; }
        .stars .count { color: #8a84a3; font-size: 0.8rem; letter-spacing: 0; margin-left: 6px; }
        .card .btn-reservar {
            margin-top: auto; text-align: center; padding: 11px; border-radius: 12px;
            background: linear-gradient(135deg, #7c3aed, #a855f7); color: #fff;
            font-weight: 700; font-size: 0.92rem;
        }
        .empty { text-align: center; color: #8a84a3; padding: 40px; grid-column: 1 / -1; }

        footer {
            padding: 30px 5%; text-align: center; color: #8a84a3; font-size: 0.85rem;
            border-top: 1px solid #ece9f7;
        }
        footer a { color: #7c3aed; font-weight: 600; }
    </style>
</head>
<body>

    <nav class="nav">
        <div class="nav-logo">Organi<span>fy</span></div>
        <a class="btn" href="login.html">Iniciar sesión</a>
    </nav>

    <header class="hero">
        <h1>Directorio de PYMEs que usan Organify</h1>
        <p>Descubre negocios locales, mira sus reseñas y agenda tu hora con un clic.</p>
    </header>

    <div class="controls">
        <div class="chips" id="directorio-chips"></div>
        <div class="search">
            <input type="text" id="directorio-buscar" placeholder="Buscar pyme o tipo de servicio..." autocomplete="off">
        </div>
    </div>

    <main class="grid" id="directorio-grid">
        <p class="empty">Cargando directorio...</p>
    </main>

    <footer>
        <p>© 2026 Organify · <a href="index.html">Inicio</a> · <a href="login.html">Crear tu negocio gratis</a></p>
    </footer>

    <script src="directorio.js" defer></script>
</body>
</html>
