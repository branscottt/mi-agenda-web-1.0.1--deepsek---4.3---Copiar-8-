<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://dfcfimipkfhitlsyixqu.supabase.co" crossorigin>
    <link rel="preconnect" href="https://challenges.cloudflare.com">
    <title>Organify - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css?v=49">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Cloudflare Turnstile Captcha -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
    <div class="login-screen">
        <div class="glass-panel login-panel">
            <!-- Logo y título -->
            <div class="logo-header">
                <a href="index.html" aria-label="Ir a la página principal de Organify" title="Organify — Inicio">
                    <img src="logo.png?v=4" alt="Organify" class="login-logo">
                </a>
                <p class="tagline">Accede a tu cuenta</p>
            </div>

            <!-- Toggle Iniciar Sesión / Registro -->
            <div class="mode-toggle">
                <button class="mode-btn active" id="login-mode">Iniciar Sesión</button>
                <button class="mode-btn" id="register-mode">Crear Cuenta</button>
            </div>

            <!-- Formulario de INICIO DE SESIÓN -->
            <div class="form-container active" id="login-container">
                <form id="login-form-modern">
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="login-email" placeholder="Correo electrónico" required autocomplete="email">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="login-password" placeholder="Contraseña" required autocomplete="current-password">
                    </div>
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember-me"> <span>Recordarme</span>
                        </label>
                        <a href="#" id="forgot-password-link">¿Olvidaste tu contraseña?</a>
                    </div>
                    <button type="submit" class="btn-grad btn-login">Iniciar Sesión</button>
                    <button type="button" id="google-login-btn" class="btn-google">
                        <i class="fab fa-google"></i> Continuar con Google
                    </button>
                    <!-- Cloudflare Turnstile Captcha -->
                    <div class="cf-turnstile" data-sitekey="0x4AAAAAAD6qpbuQ0sDmClXU" data-callback="onCaptchaReady" style="margin-top:12px; display:flex; justify-content:center;"></div>
                </form>
                <div id="login-error-message" class="error-message" style="display:none;"></div>
            </div>

            <!-- Formulario de REGISTRO -->
            <div class="form-container" id="register-container" style="display:none;">
                <form id="register-form-modern">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="register-name" placeholder="Nombre de pyme o nombre de profesional" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="register-email" placeholder="Correo electrónico" required autocomplete="email">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="register-password" placeholder="Contraseña" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="register-confirm-password" placeholder="Confirmar contraseña" required>
                    </div>
                    <!-- NUEVO CAMPO WHATSAPP -->
                    <div class="input-group">
                        <i class="fab fa-whatsapp"></i>
                        <input type="tel" id="register-whatsapp" placeholder="Número de WhatsApp (ej: +56912345678)" required autocomplete="off">
                    </div>
                    <button type="submit" class="btn-grad btn-register">Crear Cuenta</button>
                    <button type="button" id="google-login-btn-register" class="btn-google" style="margin-top:10px;">
                        <i class="fab fa-google"></i> Registrarte con Google
                    </button>
                    <!-- Turnstile Captcha (registro) -->
                    <div class="cf-turnstile" data-sitekey="0x4AAAAAAD6qpbuQ0sDmClXU" data-callback="onRegisterCaptchaReady" style="margin-top:12px; display:flex; justify-content:center;"></div>
                </form>
                <div id="register-error-message" class="error-message" style="display:none;"></div>
                <div class="register-prompt">
                    ¿Ya tienes una cuenta? <a href="#" id="back-to-login">Inicia sesión aquí</a>
                </div>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                <p>© 2025 Organify - Todos los derechos reservados</p>
            </div>
        </div>

        <!-- Directorio Público de PYMEs (se renderiza debajo del login) -->
        <div id="directorio-container"></div>

        <!-- Efectos de fondo -->
        <div class="login-background">
            <div class="bg-circle circle-1"></div>
            <div class="bg-circle circle-2"></div>
            <div class="bg-circle circle-3"></div>
        </div>
    </div>

    <!-- Modal para recuperar contraseña -->
    <div id="reset-modal" class="modal" style="display:none;">
        <div class="modal-content glass-panel" style="max-width: 400px;">
            <span class="modal-close">&times;</span>
            <h3><i class="fas fa-key"></i> Recuperar contraseña</h3>
            <p>Te enviaremos un enlace para restablecer tu contraseña.</p>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="reset-email" placeholder="Tu correo electrónico" required>
            </div>
            <div class="form-actions">
                <button id="btn-send-reset" class="btn-grad">Enviar enlace</button>
                <button id="btn-cancel-reset" class="btn-secondary">Cancelar</button>
            </div>
            <div id="reset-message" class="error-message" style="display:none; margin-top:15px;"></div>
        </div>
    </div>

    <!-- Scripts -->
<script type="module" src="dist/app.js?v=49"></script>
<script defer src="dist/legacy.js?v=49"></script>
</body>
</html>
